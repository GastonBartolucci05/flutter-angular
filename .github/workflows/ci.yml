name: CI

on: [push, pull_request]

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  angular:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: angular_app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --no-watch